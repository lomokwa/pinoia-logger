services:
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Loki API — only needed if you want to query it directly (Grafana talks to it over the Docker network)

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # discovers + tails container logs; read-only, no write access needed
      # Must be mounted at the SAME absolute path inside the container as on
      # the host: Promtail reads each container's log file using the literal
      # host path Docker reports (LogPath), it doesn't translate paths. Most
      # installs use /var/lib/docker; snap-installed Docker (common on
      # Ubuntu) uses /var/snap/docker/common/var-lib-docker instead — check
      # with `docker info --format '{{.DockerRootDir}}'` on the host and set
      # DOCKER_DATA_ROOT in .env accordingly if it's not the default.
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}/containers:${DOCKER_DATA_ROOT:-/var/lib/docker}/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # Change this after first login (Grafana forces a reset on first login
      # regardless, but set something reasonable as the initial value).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Loki datasource is auto-provisioned (see grafana/provisioning/), no manual "Add datasource" step needed.
      # Multi-user hardening: only the admin can create accounts (Administration
      # > Users > New user) — no public self-signup, no letting a logged-in
      # user spin up their own org.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      # Correct absolute URL generation for redirects/links once this sits
      # behind the Cloudflare Tunnel hostname instead of localhost:3000.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    depends_on:
      - loki

  # Exposes Grafana at a public hostname via Cloudflare Tunnel, without
  # opening any inbound port on the homelab. This is a tunnel dedicated to
  # this stack (separate from the SSH-over-cloudflared-access setup used by
  # selton-mello-bot/mc-manager's deploy workflows) — create it once in the
  # Cloudflare Zero Trust dashboard (Networks > Tunnels), point its public
  # hostname to service http://grafana:3000, and paste the tunnel token below.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - grafana

volumes:
  loki-data:
  grafana-data:
