# Minimal single-binary Loki config for a homelab-scale deployment (single
# node, filesystem storage, no object storage / clustering needed).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# How long log entries are kept before being deleted — tune to taste;
# 30 days is a reasonable default for a homelab where disk is the constraint.
limits_config:
  retention_period: 720h
  # Raised from the low defaults, which are tuned for tiny/shared multi-tenant
  # setups and are easy to hit with two chatty services logging in JSON.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
